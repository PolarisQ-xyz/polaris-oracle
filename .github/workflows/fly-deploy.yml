# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Deploy only after CI passes on main.  The `workflow_run` trigger fires when
# the named workflow completes; the `if:` guard then checks both the conclusion
# and that this is a push to main (not a PR that happened to target main).

name: Fly Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
